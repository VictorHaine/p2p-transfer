version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      critical-pake-dependency:
        patterns:
          - "@cipherman/pake-js"
        dependency-type: production
      direct-crypto-dependency:
        patterns:
          - "@noble/curves"
          - "@noble/hashes"
        dependency-type: production
      native-webrtc-dependency:
        patterns:
          - "@roamhq/wrtc"
          - "@roamhq/wrtc-*"
        dependency-type: production
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@cipherman/pake-js"
          - "@noble/curves"
          - "@noble/hashes"
          - "@roamhq/wrtc"
          - "@roamhq/wrtc-*"
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
