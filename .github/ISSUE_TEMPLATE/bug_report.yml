name: Bug report
description: Report a reproducible non-security bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use GitHub private vulnerability reporting or the private contact path in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ff --version`, package version, or commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, network shape, and whether TURN was configured.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands or browser actions. Redact private file names, codes, domains, and IPs if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only logs that do not reveal codes, file names, local paths, IPs, or private domains.
      render: text
