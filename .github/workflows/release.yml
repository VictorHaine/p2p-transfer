name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Verify tag matches package version
        run: node scripts/check-release-tag.mjs
      - name: Verify release tag is on main
        run: node scripts/check-release-main.mjs
      - name: Verify live release ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-live-release-ref.mjs
      - name: Release controls preflight
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PREFLIGHT_TOKEN }}
        run: node scripts/check-release-readiness.mjs --allow-existing-npm-version
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Browser interop tests
        run: pnpm test:browser
      - name: Dependency audit
        run: pnpm security:audit
      - name: Registry signatures
        run: pnpm security:signatures
      - name: Verify release notes
        run: node scripts/write-release-notes.mjs --check
      - name: pack release artifact
        run: node scripts/smoke-release-artifact.mjs --keep-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: release-artifacts
          if-no-files-found: error

  docker-stage:
    name: stage docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - verify
      - platform-smoke
      - docker-validate
    environment: npm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.docker_image.outputs.image }}
      digest: ${{ steps.docker_image.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Build, smoke, and stage image
        id: docker_image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-docker-image.mjs
      - name: Scan staged image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.docker_image.outputs.image }}@${{ steps.docker_image.outputs.digest }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
      - name: Generate staged image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.docker_image.outputs.image }}@${{ steps.docker_image.outputs.digest }}
          scan-type: image
          format: cyclonedx
          output: docker-image-sbom.cdx.json
          scanners: vuln
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.docker_image.outputs.image }}
          subject-digest: ${{ steps.docker_image.outputs.digest }}
          sbom-path: docker-image-sbom.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-sbom
          path: docker-image-sbom.cdx.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.docker_image.outputs.image }}
          subject-digest: ${{ steps.docker_image.outputs.digest }}
          push-to-registry: true

  docker-public-read:
    name: verify public docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - docker-stage
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Verify staged image is publicly pullable
        env:
          DOCKER_STAGED_DIGEST: ${{ needs.docker-stage.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-docker-image.mjs --assert-public

  docker-promote:
    name: promote docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - publish
      - docker-stage
    environment: npm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Promote attested image
        env:
          DOCKER_STAGED_DIGEST: ${{ needs.docker-stage.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-docker-image.mjs --promote

  docker-validate:
    name: pre-publish docker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - verify
      - platform-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Validate release Docker image
        run: DOCKER_SMOKE_TAG=p2p-transfer:release-gate node scripts/smoke-docker-policy.mjs

  platform-smoke:
    name: platform smoke / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
        node:
          - 22.22.3
          - 24.13.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed

  publish:
    name: publish npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - verify
      - platform-smoke
      - docker-validate
      - docker-stage
      - docker-public-read
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release-artifacts
      - name: verify downloaded release artifact
        id: verify_artifact
        run: node scripts/verify-release-artifact.mjs --github-output tarball
      - name: verify live release ref before attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-live-release-ref.mjs
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: verify, smoke, and publish release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-artifact.mjs

  github-release:
    name: create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - publish
      - docker-promote
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs
