name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - name: Verify tag matches package version
        run: node scripts/check-release-tag.mjs
      - name: Verify release tag is on main
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Release controls preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:preflight
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Browser interop tests
        run: pnpm test:browser
      - name: Dependency audit
        run: pnpm security:audit
      - name: Registry signatures
        run: pnpm security:signatures
      - name: Verify release notes
        run: node scripts/write-release-notes.mjs --check
      - name: pack release artifact
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts
          pnpm --config.ignore-scripts=true pack --pack-destination release-artifacts
          node scripts/write-release-checksum.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: release-artifacts
          if-no-files-found: error

  docker:
    name: release docker policy
    runs-on: ubuntu-24.04
    needs:
      - verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - name: Build image
        run: DOCKER_SMOKE_TAG=p2p-transfer:release pnpm smoke:docker-policy

  platform-smoke:
    name: platform smoke / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        node:
          - 22.22.3
          - 24.13.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed

  attest:
    name: attest release artifact
    runs-on: ubuntu-24.04
    needs:
      - verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release-artifacts
      - name: verify downloaded release artifact
        id: verify_artifact
        run: |
          tgz="$(node scripts/verify-release-artifact.mjs --print-tarball)"
          printf 'tarball=%s\n' "$tgz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.verify_artifact.outputs.tarball }}

  publish:
    name: publish npm package
    runs-on: ubuntu-24.04
    needs:
      - verify
      - attest
      - docker
      - platform-smoke
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release-artifacts
      - name: verify downloaded release artifact
        id: verify_artifact
        run: |
          tgz="$(node scripts/verify-release-artifact.mjs --print-tarball)"
          printf 'tarball=%s\n' "$tgz" >> "$GITHUB_OUTPUT"
      - name: smoke downloaded release artifact
        run: |
          tgz="${{ steps.verify_artifact.outputs.tarball }}"
          test -f "$tgz"
          PACKED_SMOKE_TARBALL="$tgz" node scripts/smoke-packed.mjs
      - name: publish npm package
        run: |
          tgz="${{ steps.verify_artifact.outputs.tarball }}"
          test -f "$tgz"
          pnpm publish "$tgz" --provenance --access public --ignore-scripts

  github-release:
    name: create GitHub release
    runs-on: ubuntu-24.04
    needs:
      - publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: verify downloaded release artifact
        id: verify_artifact
        run: |
          tgz="$(node scripts/verify-release-artifact.mjs --print-tarball)"
          printf 'tarball=%s\n' "$tgz" >> "$GITHUB_OUTPUT"
      - name: write release notes
        run: node scripts/write-release-notes.mjs
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz="${{ steps.verify_artifact.outputs.tarball }}"
          test -f "$tgz"
          test -f release-artifacts/SHA256SUMS
          test -f release-artifacts/RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" "$tgz" release-artifacts/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release-artifacts/RELEASE_NOTES.md
