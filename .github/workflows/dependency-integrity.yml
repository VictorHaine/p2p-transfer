name: dependency-integrity

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-integrity:
    name: dependency integrity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Dependency audit
        run: pnpm security:audit
      - name: Registry signature audit
        run: pnpm security:signatures
