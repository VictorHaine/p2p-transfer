name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: dependency audit
        run: |
          pnpm security:audit
          pnpm security:signatures

  browser-interop:
    name: browser interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Browser interop tests
        run: pnpm test:browser

  platform-smoke:
    name: platform smoke / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        node:
          - 22.22.3
          - 24.13.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed

  docker:
    name: production docker policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
      - name: Build image
        run: DOCKER_SMOKE_TAG=p2p-transfer:test pnpm smoke:docker-policy
