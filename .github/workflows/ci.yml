name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Release artifact smoke
        run: pnpm smoke:release-artifact
      - name: dependency audit
        run: |
          pnpm security:audit
          pnpm security:signatures

  browser-interop:
    name: browser interop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Browser interop tests
        run: pnpm test:browser

  platform-smoke:
    name: platform smoke / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
        node:
          - 22.22.3
          - 22.x
          - 24.13.1
          - 24.x
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check installed dependency tree
        run: pnpm check:install-state
      - name: Reviewed build-toolchain attestation
        run: pnpm security:build-toolchain
      - name: Reviewed dependency attestations
        run: pnpm security:dependencies
      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @roamhq/wrtc esbuild
      - name: Verify rebuilt dependency attestations
        run: |
          pnpm security:build-toolchain
          pnpm security:dependencies
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Native smoke
        run: pnpm smoke:native
      - name: Packed install smoke
        run: pnpm smoke:packed

  docker:
    name: production docker policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          node scripts/prepare-checked-pnpm.mjs
      - name: Build image
        run: DOCKER_SMOKE_TAG=p2p-transfer:test node scripts/smoke-docker-policy.mjs
